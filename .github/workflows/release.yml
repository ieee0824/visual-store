name: Binary release

on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - .github/workflows/release.yml
      - scripts/package_release.py
      - Cargo.toml
      - Cargo.lock
      - licenses/**

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            linux: true
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            linux: true
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            linux: false
          - runner: macos-15
            target: aarch64-apple-darwin
            linux: false
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.linux && 'rust:1.98.1-bookworm' || null }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        if: ${{ !matrix.linux }}
        with:
          python-version: '3.11'

      - name: Install Linux build dependencies
        if: matrix.linux
        run: |
          apt-get update
          apt-get install -y --no-install-recommends libvpx-dev pkg-config python3

      - name: Install macOS build dependencies
        if: ${{ !matrix.linux }}
        run: brew install libvpx pkg-config

      - name: Build and package
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: python3 scripts/package_release.py --target '${{ matrix.target }}' --tag "$RELEASE_TAG"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require a main-branch release tag
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Verify release assets
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 scripts/package_release.py --write-checksums --tag "$RELEASE_TAG"
          python3 scripts/package_release.py --verify-dist --tag "$RELEASE_TAG"

      - name: Publish GitHub release
        env:
          GH_TOKEN: >-
            ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/*.tar.gz dist/SHA256SUMS --verify-tag --generate-notes
