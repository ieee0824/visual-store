[package]
name = "visual-store"
version = "0.1.0"
edition = "2024"
description = "Local, reference-addressed PNG storage for coding agents"
license = "MIT"
readme = "README.md"

[[bin]]
name = "vstore"
path = "src/main.rs"

[features]
default = ["vp9"]
vp9 = ["dep:libvpx-native-sys"]
# Only for isolated failure-injection tests; never enable in installed builds.
fault-injection = []

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4.6", features = ["derive", "env"] }
crc32fast = "1.5"
flate2 = "1.1"
libc = "0.2"
libvpx-native-sys = { version = "=5.0.17", optional = true }
png = "0.18"
rusqlite = { version = "0.32.1", features = ["backup", "bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"
jsonschema = { version = "0.33", default-features = false }
