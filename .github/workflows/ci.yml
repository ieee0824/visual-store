name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  debian12-arm64:
    name: Debian 12 ARM64 libvpx 1.12
    runs-on: ubuntu-24.04-arm
    container: rust:1.98.1-bookworm
    steps:
      - uses: actions/checkout@v4

      - name: Verify Debian 12 ARM64 with system libvpx
        run: bash tests/verify_debian12_arm64.sh

  vp9-required:
    name: VP9 required (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install libvpx on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libvpx-dev pkg-config

      - name: Install libvpx on macOS
        if: runner.os == 'macOS'
        run: brew install libvpx pkg-config

      - name: Select Rust 1.95.0
        run: |
          rustup toolchain install 1.95.0 --profile minimal --component clippy
          rustup default 1.95.0

      - name: Record codec toolchain
        run: |
          rustc --version
          pkg-config --modversion vpx

      - name: Test
        run: cargo test --locked --features fault-injection

      - name: Lint
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Check codec-free metadata build
        run: |
          cargo check --locked --no-default-features
          cargo test --locked --no-default-features --lib
          cargo clippy --locked --no-default-features --lib -- -D warnings

      - name: Build no-command codec probe
        run: cargo build --locked --example vp9_roundtrip

      - name: Prove temporal capacity benchmark
        run: |
          cargo build --locked --release --example temporal_benchmark
          VSTORE_BENCH_PREPRUNE_COPY="$RUNNER_TEMP/packed-store" PATH= ./target/release/examples/temporal_benchmark "$RUNNER_TEMP/temporal-benchmark.json"

      - name: Exercise codec-free CLI behavior
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --no-default-features --target-dir "$RUNNER_TEMP/codec-free-target"
          codec_free="$RUNNER_TEMP/codec-free-target/debug/vstore"
          fixture="$RUNNER_TEMP/v1-store"
          cp -R tests/fixtures/v1-store "$fixture"
          ref='visual://c3829740-9e12-4f8a-b723-f69b76a29a05/images/c3d40628-ebe0-4e4e-b768-ac1e2a6279fa'
          "$codec_free" --store "$fixture" info "$ref"
          "$codec_free" --store "$fixture" get "$ref" --output "$RUNNER_TEMP/codec-free-png.png"
          "$codec_free" --store "$fixture" get "$ref" --variant source --output "$RUNNER_TEMP/codec-free-source.png"
          "$codec_free" --store "$fixture" verify
          set +e
          "$codec_free" --store "$RUNNER_TEMP/packed-store" get-frame --run benchmark --stream screen --frame 17 > "$RUNNER_TEMP/codec-free-get.json"
          get_status=$?
          "$codec_free" --store "$RUNNER_TEMP/packed-store" verify > "$RUNNER_TEMP/codec-free-verify.json"
          verify_status=$?
          "$codec_free" --store "$RUNNER_TEMP/packed-store" prune --dry-run > "$RUNNER_TEMP/codec-free-prune.json"
          prune_status=$?
          set -e
          test "$get_status" -eq 3
          test "$verify_status" -eq 3
          test "$prune_status" -eq 3
          grep -q 'E_CODEC_UNAVAILABLE' "$RUNNER_TEMP/codec-free-get.json"
          grep -q 'E_CODEC_UNAVAILABLE' "$RUNNER_TEMP/codec-free-verify.json"
          grep -q 'E_CODEC_UNAVAILABLE' "$RUNNER_TEMP/codec-free-prune.json"

      - name: Prove codec works with an empty PATH
        run: PATH= ./target/debug/examples/vp9_roundtrip

      - name: Check Linux dynamic codec dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          ldd target/debug/examples/vp9_roundtrip | tee /tmp/visual-store-linked-libraries.txt
          grep -q 'libvpx' /tmp/visual-store-linked-libraries.txt
          if grep -Eq 'libav(codec|format|util)|libswscale|libswresample' /tmp/visual-store-linked-libraries.txt; then
            exit 1
          fi

      - name: Check macOS dynamic codec dependencies
        if: runner.os == 'macOS'
        shell: bash
        run: |
          otool -L target/debug/examples/vp9_roundtrip | tee /tmp/visual-store-linked-libraries.txt
          grep -q 'libvpx' /tmp/visual-store-linked-libraries.txt
          if grep -Eq 'libav(codec|format|util)|libswscale|libswresample' /tmp/visual-store-linked-libraries.txt; then
            exit 1
          fi
